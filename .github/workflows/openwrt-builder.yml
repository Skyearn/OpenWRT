#
# Build OpenWrt firmware (coolsnowwolf/lede) with GitHub Actions
# Based on https://github.com/P3TERX/Actions-OpenWrt (MIT)
#
# File: .github/workflows/openwrt-builder.yml
#

name: OpenWrt Builder

on:
  repository_dispatch:
    types: [source-code-update]
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build'
        required: true
        default: all
        type: choice
        options:
          - all
          - R68S
          - K3

# The repository default is a read-only GITHUB_TOKEN, so ask for what we need:
#   contents: write -> create releases / delete old ones
#   actions:  write -> delete old workflow runs
permissions:
  contents: write
  actions: write

concurrency:
  group: openwrt-builder
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Select devices
        id: matrix
        run: |
          case "${{ github.event.inputs.device }}" in
            R68S) devices='[{"device":"R68S","config":"R68S.config"}]' ;;
            K3)   devices='[{"device":"K3","config":"K3.config"}]' ;;
            *)    devices='[{"device":"R68S","config":"R68S.config"},{"device":"K3","config":"K3.config"}]' ;;
          esac
          echo "value={\"include\":${devices}}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CONFIG_FILE: ${{ matrix.config }}
      DEVICE: ${{ matrix.device }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then mv "$FEEDS_CONF" openwrt/feeds.conf.default; fi
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update feeds
      run: |
        cd openwrt
        n=0
        until ./scripts/feeds update -a; do
          n=$((n + 1))
          if [ "$n" -ge 3 ]; then echo "::error::feeds update failed after $n attempts"; exit 1; fi
          echo "feeds update failed, retrying ($n/3)..."
          sleep 15
        done

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        if [ -e files ]; then mv files openwrt/files; fi
        if [ ! -e "$CONFIG_FILE" ]; then echo "::error::configuration file $CONFIG_FILE not found"; exit 1; fi
        mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: Download package
      id: package
      # Some mirrors (SourceForge, vendor sites) can stall for a very long
      # time; do not let one dead mirror eat the whole job budget.
      timeout-minutes: 90
      run: |
        cd openwrt
        make defconfig
        if ! grep -q '^CONFIG_TARGET_BOARD=' .config; then
          echo "::error::no target selected by 'make defconfig', refuse to build an empty image"
          exit 1
        fi
        make download -j$(nproc) || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"; fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@v7
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin_${{ matrix.device }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v7
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware_${{ matrix.device }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-$DEVICE" >> "$GITHUB_OUTPUT"
        {
          echo "Device: $DEVICE"
          echo ""
          echo "Source: $REPO_URL ($REPO_BRANCH)"
          echo ""
          echo "Commit: ${{ github.sha }}"
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

  cleanup:
    name: Cleanup old runs and releases
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Delete old workflow runs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        keep=2
        mapfile -t ids < <(gh run list --repo "$GITHUB_REPOSITORY" --limit 100 --json databaseId --jq '.[].databaseId')
        for id in "${ids[@]:$keep}"; do
          echo "Deleting workflow run $id"
          gh run delete "$id" --repo "$GITHUB_REPOSITORY" || true
        done

    - name: Remove old releases
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        keep=4
        mapfile -t tags < <(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
        for tag in "${tags[@]:$keep}"; do
          echo "Deleting release $tag"
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
        done
