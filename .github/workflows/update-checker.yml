#
# Source code update checker
# Triggered manually or by the (commented out) schedule below.
# Based on https://github.com/P3TERX/Actions-OpenWrt (MIT)
#
# File: .github/workflows/update-checker.yml
#

name: Update Checker

on:
  workflow_dispatch:
#  schedule:
#    - cron: 0 */18 * * *

# Needed to call repository_dispatch (and to keep the token usable after the
# repository default of read-only was tightened).
permissions:
  contents: write

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

    - name: Get Commit Hash
      id: getHash
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
        echo "commitHash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v6
      with:
        path: .commitHash
        key: commitHash_${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        echo "${{ steps.getHash.outputs.commitHash }}" | tee .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ github.token }}
        event-type: source-code-update
